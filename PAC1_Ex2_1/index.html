<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form Validator</title>
</head>
<body>
    <div class="container">
        <form id="form" class="form">
            <h2>Registra't al butlletí oficial</h2>
            <div class="form-control">
                <label for="username">Usuari</label>
                <input type="text" id="username" placeholder="Escriu el teu nom d'usuari">
                <small>Error message</small>

            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Escriu el teu correu electrònic">
                <small>Error message</small>

            </div>
            <div class="form-control">
                <label for="password">Contrasenya</label>
                <input type="text" id="password" placeholder="Escriu la teva contrasenya">
                <small>Error message</small>

            </div>
            <div class="form-control">
                <label for="password2">Confirma la Contrasenya</label>
                <input type="text" id="password2" placeholder="Repeteix la teva contrasenya">
                <small>Error message</small>
            </div>
            <button>Continuar</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
